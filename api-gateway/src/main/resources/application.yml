server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: location-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/locations/**
        
        - id: ride-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/rides/**
